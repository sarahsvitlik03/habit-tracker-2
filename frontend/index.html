<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Household Chore Tracker</title>
    <style>
      html, body, #app {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: #111;
        color-scheme: light;
      }
      .boot-loader {
        font-family: 'Courier New', Courier, monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        color: #444;
      }
      .boot-spinner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 4px solid rgba(0, 0, 0, 0.08);
        border-top-color: #222;
        animation: boot-spin 0.85s linear infinite;
      }
      .boot-loader p { margin: 0; letter-spacing: 0.04em; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loader" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p>Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
